<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ไตรภูมิ Monster Quest</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
    }
    body {
      background: #0b0f19;
      color: #e5e7eb;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      padding-bottom: 8px;
    }
    #gameBody {
      outline: none;
      width: 100%;
      max-width: 640px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    #gameBody:focus {
      outline: 2px solid #3b82f6;
      outline-offset: 2px;
      border-radius: 4px;
    }
    .status {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      background: #1f2937;
      border: 2px solid #374151;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 10px;
      font-weight: 700;
      font-size: 0.92rem;
    }
    .money { color: #fbbf24; }
    #display {
      background: #111827;
      border: 2px solid #374151;
      border-radius: 8px;
      padding: 16px;
      min-height: 180px;
      max-height: 42vh;
      overflow-y: auto;
      font-size: 1.02rem;
      line-height: 1.6;
      white-space: pre-wrap;
      flex-shrink: 0;
    }
    .help {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #9ca3af;
      text-align: center;
      line-height: 1.5;
    }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0);
      border: 0;
    }

    /* ===== Mobile controls (เข้าถึงได้แบบ NVDA/TalkBack) ===== */
    #mobileControls {
      display: none;
      margin-top: 12px;
      width: 100%;
      max-width: 640px;
      user-select: none;
      -webkit-user-select: none;
    }
    #mobileControls.visible {
      display: block;
    }
    .mc-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    /* D-pad แบบปุ่ม 4 ทิศ — ใช้กับ TalkBack/VoiceOver ได้ */
    .dpad-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      gap: 6px;
      max-width: 220px;
      margin: 0 auto;
      width: 100%;
    }
    .dpad-grid .mc-dir {
      min-height: 56px;
      font-size: 1.1rem;
    }
    .dpad-grid .dir-up    { grid-column: 2; grid-row: 1; }
    .dpad-grid .dir-left  { grid-column: 1; grid-row: 2; }
    .dpad-grid .dir-right { grid-column: 3; grid-row: 2; }
    .dpad-grid .dir-down  { grid-column: 2; grid-row: 3; }
    .dpad-grid .dir-center {
      grid-column: 2; grid-row: 2;
      background: #0f172a;
      border-color: #334155;
      color: #64748b;
      font-size: 0.75rem;
      pointer-events: none;
    }

    .action-btns {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .mc-btn {
      background: #1e293b;
      border: 2px solid #475569;
      color: #e2e8f0;
      border-radius: 12px;
      padding: 12px 6px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      min-height: 52px;
      -webkit-tap-highlight-color: transparent;
    }
    .mc-btn:active, .mc-btn.pressed, .mc-btn:focus {
      background: #334155;
      border-color: #60a5fa;
      color: #93c5fd;
      outline: 2px solid #93c5fd;
      outline-offset: 2px;
    }
    .mc-btn.primary {
      background: #1e3a5f;
      border-color: #3b82f6;
    }
    .mc-btn.primary:active, .mc-btn.primary.pressed, .mc-btn.primary:focus {
      background: #2563eb;
      border-color: #93c5fd;
    }
    .mc-hint {
      text-align: center;
      font-size: 0.78rem;
      color: #94a3b8;
      margin-top: 4px;
      line-height: 1.45;
    }

    /* Chat panel mobile tweak */
    #chatPanel {
      margin-top: 10px;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 10px;
      width: 100%;
    }

    /* บนจอใหญ่ซ่อนแผงมือถือ — ยกเว้นมีคลาส force-show */
    @media (min-width: 900px) {
      #mobileControls:not(.force-show) { display: none !important; }
    }

    /* ===== หน้าจอเริ่มเกม ===== */
    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0b0f19;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    #startScreen.hidden {
      display: none;
    }
    #startScreen h1 {
      font-size: 1.6rem;
      color: #fbbf24;
      margin-bottom: 8px;
    }
    #startScreen p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    #startBtn {
      background: linear-gradient(180deg, #3b82f6, #1d4ed8);
      border: 2px solid #93c5fd;
      color: #fff;
      font-size: 1.35rem;
      font-weight: 800;
      padding: 18px 48px;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(37, 99, 235, 0.45);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      min-width: 220px;
    }
    #startBtn:active {
      transform: scale(0.97);
      background: #2563eb;
    }
  </style>
</head>
<body>
  <!-- หน้าจอเริ่มเกม (ซ่อนอัตโนมัติหลังโหลด — role=application จะเข้าโหมดโฟกัสเอง) -->
  <div id="startScreen" class="hidden" aria-hidden="true">
    <h1>ไตรภูมิ Monster Quest</h1>
    <p>กำลังเข้าสู่เกม...</p>
    <button type="button" id="startBtn">เริ่มเกม</button>
  </div>

  <div id="gameBody" tabindex="0" role="application" aria-label="ไตรภูมิ Monster Quest เกมสำรวจและจับมอนสเตอร์ กดลูกศรเพื่อเดิน Enter เพื่อยืนยัน">
    <div class="status" aria-live="polite">
      <span>บอล: <span id="ball-count">0</span> | อาหาร: <span id="food-count">0</span> | หิน: <span id="evo-count">0</span></span>
      <span class="money">เหรียญ: <span id="money">1,000</span> G</span>
    </div>
    <div id="display" role="status" aria-live="assertive" aria-atomic="true">กำลังเริ่มเกม...</div>
    <div id="chatPanel" style="display:none;">
      <div style="font-weight:700; margin-bottom:8px; color:#93c5fd; display:flex; justify-content:space-between; align-items:center;">
        <span>แชทโลกไตรภูมิ</span>
        <button type="button" id="chatCloseBtn" style="background:#334155; border:none; color:#e2e8f0; border-radius:6px; padding:4px 10px; font-size:0.8rem; cursor:pointer;">ปิด</button>
      </div>
      <div id="chatLog" style="height:100px; overflow-y:auto; background:#020617; border-radius:6px; padding:8px; font-size:0.88rem; line-height:1.5; margin-bottom:8px; white-space:pre-wrap;"></div>
      <input id="chatInput" type="text" placeholder="พิมพ์แชทแล้วกด Enter..." maxlength="120"
        style="width:100%; padding:8px 10px; border-radius:6px; border:1px solid #475569; background:#1e293b; color:#e2e8f0; outline:none; box-sizing:border-box; font-size:16px;" />
    </div>
    <div class="help" id="helpText">
      ลูกศร / WASD = เดิน · Enter = ยืนยัน · C = ค้นหามอน · I = คลัง · M = ช่วยเหลือ · / = แชท
    </div>
  </div>

  <!-- Mobile controls — ปุ่มทิศทาง + คำสั่ง อ่านด้วย TalkBack/VoiceOver ได้เหมือน NVDA -->
  <div id="mobileControls" style="display:none;" role="group" aria-label="แผงควบคุมเกมมือถือ">
    <div class="mc-row">
      <div class="dpad-grid" role="group" aria-label="ปุ่มเดิน">
        <button type="button" class="mc-btn mc-dir dir-up" data-dir="up" aria-label="เดินขึ้น กดค้างเพื่อเดินต่อ">▲ ขึ้น</button>
        <button type="button" class="mc-btn mc-dir dir-left" data-dir="left" aria-label="เดินซ้าย กดค้างเพื่อเดินต่อ">◀ ซ้าย</button>
        <div class="mc-btn dir-center" aria-hidden="true">เดิน</div>
        <button type="button" class="mc-btn mc-dir dir-right" data-dir="right" aria-label="เดินขวา กดค้างเพื่อเดินต่อ">ขวา ▶</button>
        <button type="button" class="mc-btn mc-dir dir-down" data-dir="down" aria-label="เดินลง กดค้างเพื่อเดินต่อ">▼ ลง</button>
      </div>
      <div class="action-btns" role="group" aria-label="ปุ่มคำสั่ง">
        <button type="button" class="mc-btn primary" data-action="enter" aria-label="ยืนยัน หรือเปิดร้าน">ยืนยัน</button>
        <button type="button" class="mc-btn" data-action="esc" aria-label="กลับ หรือหนี">กลับ</button>
        <button type="button" class="mc-btn" data-action="c" aria-label="ค้นหาสัตว์ป่า">ค้นหามอน</button>
        <button type="button" class="mc-btn" data-action="i" aria-label="เปิดคลังสัตว์เลี้ยง">คลัง</button>
        <button type="button" class="mc-btn" data-action="b" aria-label="เช็คพิกัดปัจจุบัน">พิกัด</button>
        <button type="button" class="mc-btn" data-action="m" aria-label="เมนูช่วยเหลือ">ช่วยเหลือ</button>
      </div>
    </div>
    <div class="mc-hint" id="mobileHint">กดค้างปุ่มทิศทางเพื่อเดิน · ปุ่มคำสั่งด้านล่าง · ข้อความเกมอ่านอัตโนมัติ</div>
  </div>

  <div id="srAnnouncer" class="sr-only" aria-live="assertive"></div>

<script>
// ============================================================
// 1. แผนที่ + เสียง
// ============================================================
const size = 100;
let r = 49;
let c = 49;
let lastMoveTime = 0;
const MOVE_COOLDOWN = 450; // มิลลิวินาที (ยิ่งมากยิ่งเดินช้า)

const bgm = new Audio('forest_ambient.wav');
bgm.loop = true; bgm.volume = 0.40;

const sounds = {
  grass:    [new Audio('step_grass1.wav'), new Audio('step_grass2.wav'), new Audio('step_grass3.wav')],
  mountain: [new Audio('step_mountain.wav')],
  stone:    [new Audio('step_stone1.wav'), new Audio('step_stone2.wav')],
  dirt:     [new Audio('step_dirt1.wav'), new Audio('step_dirt2.wav')],
  water:    [new Audio('step_water1.wav'), new Audio('step_water2.wav')],
  wall: new Audio('wall_hit.wav'),
  edge: new Audio('edge_hit.wav'),
  ocean: new Audio('ocean_ambient.wav'),
  forest: new Audio('forest_ambient.wav')
};

Object.values(sounds).forEach(item => {
  if (Array.isArray(item)) item.forEach(s => s.volume = 0.45);
  else if (item !== sounds.ocean && item !== sounds.forest) item.volume = 0.55;
});
sounds.ocean.loop = true;  sounds.ocean.volume = 0.35;
sounds.forest.loop = true; sounds.forest.volume = 0.42;

function playStepSound(type = 'dirt') {
  const list = sounds[type];
  if (!list || !list.length) return;
  const sound = list[Math.floor(Math.random() * list.length)];
  sound.currentTime = 0;
  sound.play().catch(() => {});
}
function playWallSound() { sounds.wall.currentTime = 0; sounds.wall.play().catch(() => {}); }
function playEdgeSound() { sounds.edge.currentTime = 0; sounds.edge.play().catch(() => {}); }

function updateAmbientSound(zone) {
  const isOcean  = zone.includes("มหาสมุทร");
  const isForest = zone.includes("ป่าหิมพานต์");
  if (isOcean)  { if (sounds.ocean.paused)  { sounds.ocean.currentTime = 0;  sounds.ocean.play().catch(() => {}); } }
  else if (!sounds.ocean.paused)  sounds.ocean.pause();
  if (isForest) { if (sounds.forest.paused) { sounds.forest.currentTime = 0; sounds.forest.play().catch(() => {}); } }
  else if (!sounds.forest.paused) sounds.forest.pause();
}

function getZoneName(row, col) {
  if (row >= 40 && row <= 60 && col >= 40 && col <= 60)
    return "เมืองหลวงไตรภูมิ (เขตปลอดภัยและชุมชน)";
  if (row < 40 && col >= 30 && col <= 70)
    return "เขาพระสุเมรุ (ดินแดนศักดิ์สิทธิ์และวิหาร)";
  if (row >= 60 && col >= 30 && col <= 70)
    return "ป่าหิมพานต์ (ดินแดนลึกลับและสัตว์ป่าหิมพานต์)";
  if (col < 30)
    return "มหาสมุทรสีทันดร (คลื่นลมแรงและเกาะแก่ง)";
  if (col > 70)
    return "ป่ากว้างชายแดน (แนวเขตธรรมชาติอันไกลโพ้น)";
  return "ทุ่งราบกว้างใหญ่ (พื้นที่รกร้างและทางผ่าน)";
}

function isCityGate(row, col) {
  const onWallLine = (row === 39 || row === 61 || col === 39 || col === 61);
  const inGateRange = (col >= 48 && col <= 52) || (row >= 48 && row <= 52);
  return onWallLine && inGateRange;
}

function isWall(row, col) {
  const isCityWallRow = (row === 39 || row === 61) && (col >= 40 && col <= 60);
  const isCityWallCol = (col === 39 || col === 61) && (row >= 40 && row <= 60);
  if ((isCityWallRow || isCityWallCol) && !isCityGate(row, col))
    return "กำแพงเมืองหลวงโบราณหนาแน่น";
  if (row === 38 && (col < 35 || col > 65))
    return "แนวเทือกเขาหินสูงชัน";
  if (row === 62 && (col < 40 || col > 60))
    return "แนวต้นไม้หนาทึบและหนาม";
  return null;
}

// ร้านค้าที่วางบนพื้นเมือง (พิกัด row,col)
const CITY_SHOPS = {
  "48,50": { id: "ball_shop",   name: "ร้านลูกบอล",       desc: "ขาย Pokeball / Great Ball / Ultra Ball" },
  "50,48": { id: "food_shop",   name: "ร้านอาหารสัตว์",   desc: "ขายอาหารธาตุต่างๆ" },
  "52,50": { id: "evo_shop",    name: "ร้านหินวิวัฒนาการ", desc: "ขายหินวิวัฒนาการ" },
  "50,52": { id: "info_center", name: "ศูนย์ข้อมูล",      desc: "ดูคำแนะนำและสถานะรวม" },
  "50,50": { id: "arena",       name: "ลานประลองไตรภูมิ", desc: "ต่อสู้กับนักรบอื่นเพื่อรับรางวัล" }
};

function getShopAt(row, col) {
  return CITY_SHOPS[row + "," + col] || null;
}

function announce(text) {
  const disp = document.getElementById('display');
  const sr = document.getElementById('srAnnouncer');
  if (disp) disp.innerText = text;
  // เคลียร์แล้วใส่ใหม่ เพื่อให้ screen reader อ่านซ้ำได้
  if (sr) {
    sr.innerText = '';
    setTimeout(function() { sr.innerText = text; }, 20);
  }
}

// ============================================================
// 2. ข้อมูลเกม
// ============================================================
const STORAGE_KEY_PLAYER = 'tri_monster_player_v4';
const STORAGE_KEY_PETS   = 'tri_monster_pets_v4';

const SHOP_ITEMS = {
  pokeball:  { name: 'Pokeball ธรรมดา', price: 100 },
  greatball: { name: 'Great Ball',     price: 300 },
  ultraball: { name: 'Ultra Ball',     price: 800 }
};

const PET_FOODS = {
  food_fire:     { name: 'อาหารธาตุไฟ',   price: 80 },
  food_water:    { name: 'อาหารธาตุน้ำ',  price: 80 },
  food_grass:    { name: 'อาหารธาตุพืช',  price: 80 },
  food_electric: { name: 'อาหารธาตุไฟฟ้า', price: 100 },
  food_rock:     { name: 'อาหารธาตุหิน',  price: 80 }
};

const SPECIAL_SHOP = {
  evo_stone: { name: 'หินวิวัฒนาการ', price: 500 }
};

const ELEMENT_WEAKNESS = {
  'ไฟ': 'น้ำ', 'น้ำ': 'ไฟฟ้า', 'พืช': 'ไฟ', 'ไฟฟ้า': 'หิน', 'หิน': 'พืช'
};

const EVOLUTION_MAP = {
  'ฮิโตคาเงะ': 'ลิซาร์ดอน', 'ฟุชิกิดาเนะ': 'ฟุชิกิบาสะ', 'เซนิกาเมะ': 'คาเมล็อค',
  'กระต่ายทุ่งหญ้า': 'กระต่ายสายฟ้า', 'กบใบไม้': 'กบยักษ์พงไพร', 'หนูพงไพร': 'หนูราชา',
  'เต่าคลื่นวารี': 'เต่าเกราะโบราณ', 'จิ้งจอกสายหมอก': 'จิ้งจอกราตรี',
  'งูหลามพงไพร': 'พญานาคใบไม้', 'ค้างคาวสายฟ้า': 'ค้างคาวยักษ์สายฟ้า',
  'สิงโตหิน': 'ราชสีห์หินลาวา', 'นกสายฟ้า': 'พญาครุฑสายฟ้า',
  'มังกรน้อยภูเขา': 'มังกรภูเขาไฟ', 'เสือไฟ': 'เสือเพลิง',
  'ปลาวาฬน้อย': 'ปลาวาฬยักษ์', 'ฉลามสายฟ้า': 'ฉลามจักรพรรดิ',
  'เต่าทะเลโบราณ': 'เต่าทะเลเทพ', 'หมาป่าราชสีห์': 'หมาป่าราชา',
  'นกอินทรีหิน': 'นกอินทรีเหล็ก'
};

function getCatchZone(zoneName) {
  if (zoneName.includes("เมืองหลวง")) return null;
  if (zoneName.includes("ทุ่งราบ")) {
    return { name: "ทุ่งราบกว้างใหญ่", levelMin: 1, levelMax: 6, elements: ['พืช','น้ำ'],
      names: ['ฟุชิกิดาเนะ','เถาวัลย์พฤกษา','กระต่ายทุ่งหญ้า','กบใบไม้','หนูพงไพร','เต่าคลื่นวารี','นกทุ่ง'] };
  }
  if (zoneName.includes("ป่าหิมพานต์")) {
    return { name: "ป่าหิมพานต์", levelMin: 8, levelMax: 16, elements: ['พืช','ไฟฟ้า','น้ำ'],
      names: ['จิ้งจอกสายหมอก','งูหลามพงไพร','ค้างคาวสายฟ้า','หนูสายฟ้าฟาด','เห็ดพิษราตรี','ไดโนเสาร์ใบมีด','เสือลายเมฆ'] };
  }
  if (zoneName.includes("เขาพระสุเมรุ")) {
    return { name: "เขาพระสุเมรุ", levelMin: 14, levelMax: 26, elements: ['หิน','ไฟ','ไฟฟ้า'],
      names: ['สิงโตหิน','นกสายฟ้า','มังกรน้อยภูเขา','เสือไฟ','กบหินลาวา','พญาครุฑน้อย','ยักษ์หิน'] };
  }
  if (zoneName.includes("มหาสมุทร")) {
    return { name: "มหาสมุทรสีทันดร", levelMin: 7, levelMax: 18, elements: ['น้ำ','ไฟฟ้า'],
      names: ['ปลาวาฬน้อย','ฉลามสายฟ้า','เต่าทะเลโบราณ','หมึกยักษ์','ปูหินปะการัง','นางเงือกน้อย','พญานาคทะเล'] };
  }
  if (zoneName.includes("ป่ากว้างชายแดน")) {

function saveGame() {
  try {
    localStorage.setItem(STORAGE_KEY_PLAYER, JSON.stringify(playerData));
    localStorage.setItem(STORAGE_KEY_PETS, JSON.stringify(petInventory));
  } catch (e) {}
}

function loadGame() {
  try {
    const p = localStorage.getItem(STORAGE_KEY_PLAYER);
    const pets = localStorage.getItem(STORAGE_KEY_PETS);
    playerData = p ? JSON.parse(p) : JSON.parse(JSON.stringify(defaultPlayerData));
    petInventory = pets ? JSON.parse(pets) : JSON.parse(JSON.stringify(defaultPetInventory));
    if (!playerData.inventory) playerData.inventory = Object.assign({}, defaultPlayerData.inventory);
    if (typeof playerData.inventory.evo_stone !== 'number') playerData.inventory.evo_stone = 0;
    if (typeof playerData.arenaWins !== 'number') playerData.arenaWins = 0;
    petInventory.forEach(function(p) { if (!p.maxHp) p.maxHp = p.hp; });
  } catch (e) {
    playerData = JSON.parse(JSON.stringify(defaultPlayerData));
    petInventory = JSON.parse(JSON.stringify(defaultPetInventory));
  }
  updateStatusBar();
}

function updateStatusBar() {
  const inv = playerData.inventory || {};
  const balls = (inv.pokeball||0) + (inv.greatball||0) + (inv.ultraball||0);
  const foods = (inv.food_fire||0)+(inv.food_water||0)+(inv.food_grass||0)+(inv.food_electric||0)+(inv.food_rock||0);
  document.getElementById('ball-count').textContent = balls;
  document.getElementById('food-count').textContent = foods;
  document.getElementById('evo-count').textContent = inv.evo_stone || 0;
  document.getElementById('money').textContent = playerData.money.toLocaleString();
}

// ============================================================
// 3. การเดิน
// ============================================================
function move(dr, dc) {
  if (mode !== 'explore') return;
  const now = Date.now();
  if (now - lastMoveTime < MOVE_COOLDOWN) return;
  lastMoveTime = now;
  const newR = r + dr;
  const newC = c + dc;

  if (newR >= 0 && newR < size && newC >= 0 && newC < size) {
    const wallReason = isWall(newR, newC);
    if (wallReason) {
      playWallSound();
      announce("เดินไปไม่ได้! ชนเข้ากับ: " + wallReason);
      return;
    }
    r = newR; c = newC;
    const zone = getZoneName(r, c);

    let soundType = 'dirt';
    if (zone.includes("ป่าหิมพานต์") || zone.includes("ทุ่งราบ") || zone.includes("ป่ากว้าง")) soundType = 'grass';
    else if (zone.includes("เมืองหลวง")) soundType = 'stone';
    else if (zone.includes("เขาพระสุเมรุ")) soundType = 'mountain';
    else if (zone.includes("มหาสมุทร")) soundType = 'water';

    playStepSound(soundType);
    updateAmbientSound(zone);

    const shop = getShopAt(r, c);
    if (shop) {
      announce("คุณยืนอยู่หน้า" + shop.name + "\n" + shop.desc + "\n\nกด Enter เพื่อเข้าใช้บริการ");
      return;
    }

    // มอนโผล่เองตอนเดินนอกเมือง (โอกาส ~18%)
    const catchZone = getCatchZone(zone);
    if (catchZone && Math.random() < 0.18) {
      startSearch(true);
      return;
    }

    if (isCityGate(r, c)) {
      announce("คุณกำลังผ่านประตูเมืองหลวงไตรภูมิ | โซน: " + zone);
    } else {
      announce("เข้าสู่ " + zone);
    }
  } else {
    playEdgeSound();
    announce("ชนขอบแผนที่ ไปต่อไม่ได้");
  }
}

function checkCurrentPosition() {
  const zone = getZoneName(r, c);
  const shop = getShopAt(r, c);
  const catchable = getCatchZone(zone) ? "มอนโผล่ได้ตอนเดิน / กด C ค้นหา" : "เขตปลอดภัย (มีร้าน + ลานประลอง)";
  let text = "พิกัด " + (r+1) + ", " + (c+1) + "\nโซน: " + zone + "\nสถานะ: " + catchable + "\nชัยชนะลานประลอง: " + (playerData.arenaWins || 0);
  if (shop) text += "\n\nคุณยืนอยู่หน้า: " + shop.name + "\nกด Enter เพื่อเปิด";
  announce(text);
}

function tryInteract() {
  if (mode !== 'explore') return;
  const shop = getShopAt(r, c);
  if (!shop) {
    announce("ไม่มีอะไรให้โต้ตอบที่นี่\nเดินไปยืนหน้าร้านในเมืองแล้วกด Enter");
    return;
  }
  openShopById(shop.id);
}

function renderMenu(title, hint) {
  let t = title + "\n\n";
  menuOptions.forEach(function(opt, i) {
    const mark = (i === menuCursor ? "▶ " : "  ");
    t += mark + opt.label + "\n\n";
  });
  t += (hint || "ลูกศรขึ้น/ลง เลือก | Enter ยืนยัน | Esc กลับ");
  announce(t);
  if (menuOptions[menuCursor]) {
    const sr = document.getElementById('srAnnouncer');
    if (sr) sr.innerText = 'เลือก ' + menuOptions[menuCursor].label;
  }
}

function menuMove(delta) {
  if (!menuOptions.length) return;
  menuCursor = (menuCursor + delta + menuOptions.length) % menuOptions.length;
  if (mode === 'shop') {
    renderMenu(menuTitle || 'ร้านค้า', 'ลูกศรขึ้น/ลง เลือก | Enter ซื้อ | Esc กลับ');
  } else if (mode === 'inventory') {
    renderInventoryMenu();
  } else if (mode === 'catch_select' || mode === 'arena_select') {
    renderPetSelectMenu(mode === 'arena_select' ? 'ลานประลอง — เลือกสัตว์' : 'เลือกสัตว์เลี้ยงเข้าต่อสู้');
  } else if (mode === 'battle') {
    renderBattleMenu();
  } else if (mode === 'inventory_action') {
    renderInvActionMenu();
  }
}


function buy(itemKey) {
  if (mode !== 'shop') return;
  const item = SHOP_ITEMS[itemKey] || PET_FOODS[itemKey] || SPECIAL_SHOP[itemKey];
  if (!item) return;
  if (playerData.money < item.price) {
    announce("เงินไม่พอ! ต้องการ " + item.price + " G\n(ตอนนี้มี " + playerData.money + " G)");
    return;
  }
  playerData.money -= item.price;
  playerData.inventory[itemKey] = (playerData.inventory[itemKey] || 0) + 1;
  saveGame();
  updateStatusBar();
  announce("ซื้อ " + item.name + " สำเร็จ! (-" + item.price + " G)\nเงินเหลือ " + playerData.money + " G");
}

function startSearch(fromRandom) {
  if (mode !== 'explore') return;
  const zoneName = getZoneName(r, c);
  const catchZone = getCatchZone(zoneName);

  if (!catchZone) {
    if (!fromRandom) {
      announce("เมืองหลวงเป็นเขตปลอดภัย\nไม่สามารถจับหรือต่อสู้ได้ที่นี่\nออกไปนอกเมืองก่อน");
    }
    return;
  }

  const level   = Math.floor(Math.random() * (catchZone.levelMax - catchZone.levelMin + 1)) + catchZone.levelMin;
  const name    = catchZone.names[Math.floor(Math.random() * catchZone.names.length)];
  const element = catchZone.elements[Math.floor(Math.random() * catchZone.elements.length)];
  const atk     = level * 5 + Math.floor(Math.random() * 8) + 12;
  const hp      = level * 8 + Math.floor(Math.random() * 12) + 25;

  const enemy = {
    name: name, level: level, element: element, atk: atk, hp: hp, maxHp: hp,
    weakness: ELEMENT_WEAKNESS[element] || 'น้ำ',
    sellPrice: level * 40 + 80,
    zoneName: catchZone.name,
    evolved: false
  };

  if (petInventory.length === 0) {
    battleState = { myPet: null, enemy: enemy, isWild: true, canCatch: true };
    mode = 'battle';
    showBattleUI("คุณยังไม่มีสัตว์เลี้ยง\nใช้การโยนบอลเพื่อจับตัวแรก!");
    return;
  }

  battleState = { myPet: null, enemy: enemy, isWild: true, canCatch: true };
  mode = 'catch_select';
  menuTitle = (fromRandom ? '!! สัตว์ป่าโผล่มา !!' : 'พบสัตว์ป่า') + '\n' + name + ' Lv.' + level + ' (' + element + ')!\nATK ' + atk + ' | HP ' + hp;
  menuCursor = 0;
  menuOptions = petInventory.map(function(p, i) {
    return { id: i, label: p.name + ' Lv.' + p.level + ' (' + p.element + ') ATK' + p.atk + ' HP' + p.hp + '/' + (p.maxHp||p.hp) };
  });
  renderPetSelectMenu(menuTitle);
}

function renderPetSelectMenu(title) {
  let t = (title || menuTitle || 'เลือกสัตว์เลี้ยง') + '\n\n';
  menuOptions.forEach(function(opt, i) {
    const mark = (i === menuCursor ? '▶ ' : '  ');
    t += mark + opt.label + '\n\n';
  });
  t += 'ลูกศรขึ้น/ลง เลือก | Enter ยืนยัน | Esc ยกเลิก';
  announce(t);
  if (menuOptions[menuCursor]) {
    const sr = document.getElementById('srAnnouncer');
    if (sr) sr.innerText = 'เลือก ' + menuOptions[menuCursor].label;

}




function selectBattlePet(index) {
  if (index < 0 || index >= petInventory.length) return;
  const pet = petInventory[index];
  battleState.myPet = {
    name: pet.name, level: pet.level, element: pet.element,
    atk: pet.atk, hp: pet.hp, maxHp: pet.maxHp || pet.hp,

function showBattleUI(extraMsg) {
  if (!battleState) return;

function buildBattleOptions() {
  menuOptions = [];
  if (battleState.myPet) {
    menuOptions.push({ id: 'normal', label: 'โจมตีปกติ' });
    menuOptions.push({ id: 'heavy', label: 'โจมตีหนัก (แรงขึ้น แต่อาจพลาด)' });
    menuOptions.push({ id: 'element', label: 'สกิลธาตุ ' + battleState.myPet.element + ' (ได้เปรียบธาตุ)' });
  }
  if (battleState.canCatch && battleState.isWild) {

    menuOptions.push({ id: 'greatball', label: 'โยน Great Ball' });
    menuOptions.push({ id: 'ultraball', label: 'โยน Ultra Ball' });

function renderBattleMenu(extraMsg) {
  if (!battleState) return;
  const myPet = battleState.myPet;
  const enemy = battleState.enemy;
  let t = (extraMsg ? extraMsg + '\n\n' : '') + '=== การต่อสู้ ===\n\n';
  if (myPet) {
    t += 'คุณ: ' + myPet.name + ' Lv.' + myPet.level + ' (' + myPet.element + ')\n';
    t += 'HP ' + myPet.hp + '/' + myPet.maxHp + ' | ATK ' + myPet.atk + '\n\n';
  } else {
    t += 'คุณ: (ยังไม่มีสัตว์เลี้ยง)\n\n';
  }
  t += 'ศัตรู: ' + enemy.name + ' Lv.' + enemy.level + ' (' + enemy.element + ')\n';
  t += 'HP ' + Math.max(0, enemy.hp) + '/' + enemy.maxHp + ' | ATK ' + enemy.atk + '\n\n';
  t += 'เลือกสกิล (ลูกศรขึ้น/ลง | Enter ใช้):\n\n';
  menuOptions.forEach(function(opt, i) {
    const mark = (i === menuCursor ? '▶ ' : '  ');
    t += mark + opt.label + '\n\n';
  });
  announce(t);
  if (menuOptions[menuCursor]) {
    const sr = document.getElementById('srAnnouncer');
    if (sr) sr.innerText = 'เลือก ' + menuOptions[menuCursor].label;
  }
}


function doSkill(skill) {
  if (mode !== 'battle' || !battleState) return;
  const myPet = battleState.myPet;
  const enemy = battleState.enemy;
  const isWild = battleState.isWild;
  const canCatch = battleState.canCatch;
  let log = "";

  if (skill === 'normal' || skill === 'heavy' || skill === 'element') {
    if (!myPet) {
      announce("คุณยังไม่มีสัตว์เลี้ยง ให้ใช้การโยนบอลแทน");
      return;
    }

    let dmg = myPet.atk;
    let miss = 0;

    if (skill === 'heavy') {
      dmg = Math.floor(dmg * 1.55);
      miss = 0.22;
    }
    if (skill === 'element') {
      dmg = Math.floor(dmg * 1.25);
      if (ELEMENT_WEAKNESS[enemy.element] === myPet.element) {
        dmg = Math.floor(dmg * 1.45);
        log += "สกิลธาตุได้เปรียบ! ";
      }
    }

    if (Math.random() < miss) {
      log += "โจมตีพลาด!\n";
    } else {
      enemy.hp -= dmg;
      log += "สร้างความเสียหาย " + dmg + " แต้ม!\n";
      log += "HP ศัตรูเหลือ " + Math.max(0, enemy.hp) + "\n";
    }

    if (enemy.hp <= 0) {
      const reward = isWild ? (30 + enemy.level * 12) : (80 + enemy.level * 25);
      playerData.money += reward;
      if (!isWild) playerData.arenaWins = (playerData.arenaWins || 0) + 1;
      saveGame();
      updateStatusBar();
      announce(
        "ชนะแล้ว!\nได้รับ " + reward + " G\n" +
        (isWild ? "(มอนป่าถูกเอาชนะ)\n" : "ชัยชนะลานประลอง: " + playerData.arenaWins + "\n") +
        "\nกด C หรือ R เพื่อหาต่อสู้ต่อ"
      );
      mode = 'explore';
      battleState = null;
      return;
    }

    log += enemyCounterAttack();
    if (battleState && battleState.myPet && battleState.myPet.hp <= 0) {
      announce(log + "\nสัตว์เลี้ยงของคุณหมดแรง!\nคุณแพ้การต่อสู้ครั้งนี้");
      mode = 'explore';
      battleState = null;
      return;
    }
    announce(log + "\n" + getSkillPrompt());
    return;
  }

  if (skill === 'pokeball' || skill === 'greatball' || skill === 'ultraball') {
    if (!canCatch || !isWild) {
      announce("ตอนนี้โยนบอลไม่ได้");
      return;
    }
    throwBallInBattle(skill);
    return;
  }

  if (skill === 'flee') {
    announce("คุณหนีออกมาอย่างปลอดภัย");
    mode = 'explore';
    battleState = null;
  }
}

function enemyCounterAttack() {
  if (!battleState || !battleState.myPet) return "";
  const myPet = battleState.myPet;
  const enemy = battleState.enemy;
  let dmg = enemy.atk;
  if (ELEMENT_WEAKNESS[myPet.element] === enemy.element) {
    dmg = Math.floor(dmg * 1.4);
  }
  dmg = Math.floor(dmg * (0.8 + Math.random() * 0.4));
  myPet.hp -= dmg;
  return "\n" + enemy.name + " โจมตีกลับ! ความเสียหาย " + dmg + "\nHP ของคุณเหลือ " + Math.max(0, myPet.hp) + "\n";
}

function getSkillPrompt() {
  let t = "เลือกสกิล: 1 ปกติ | 2 หนัก | 3 ธาตุ";
  if (battleState && battleState.canCatch) t += " | 4/5/6 โยนบอล";
  t += " | F หนี";
  return t;
}

function throwBallInBattle(type) {
  const inv = playerData.inventory;
  if ((inv[type] || 0) <= 0) {
    announce("ไม่มี " + (SHOP_ITEMS[type] ? SHOP_ITEMS[type].name : type) + " เหลือแล้ว");
    return;
  }
  inv[type]--;
  updateStatusBar();
  saveGame();

  const enemy = battleState.enemy;
  const base = Math.max(12, Math.round(88 - ((enemy.level - 1) / 49) * 70));
  let bonus = type === 'greatball' ? 20 : type === 'ultraball' ? 42 : 0;
  const hpRatio = Math.max(0.2, enemy.hp / enemy.maxHp);
  const rate = Math.min(93, Math.floor((base + bonus) * (1.35 - hpRatio * 0.6)));
  const roll = Math.random() * 100;

  if (roll < rate) {
    petInventory.push({
      id: Date.now(),
      name: enemy.name,
      level: enemy.level,
      element: enemy.element,
      atk: enemy.atk,
      hp: enemy.maxHp,
      maxHp: enemy.maxHp,
      weakness: enemy.weakness,
      sellPrice: enemy.sellPrice,
      evolved: false
    });
    saveGame();
    announce("จับสำเร็จ!\n" + enemy.name + " Lv." + enemy.level + " เข้าคลังแล้ว\n(จากโซน: " + enemy.zoneName + ")");
    mode = 'explore';
    battleState = null;
  } else {
    let log = "โยนบอลพลาด! " + enemy.name + " ดิ้นหลุด\n";
    if (Math.random() < 0.28) {
      announce(log + enemy.name + " วิ่งหนีไปแล้ว");
      mode = 'explore';
      battleState = null;
      return;
    }
    if (battleState.myPet) {
      log += enemyCounterAttack();
      if (battleState.myPet.hp <= 0) {
        announce(log + "\nสัตว์เลี้ยงหมดแรง! คุณแพ้");
        mode = 'explore';
        battleState = null;
        return;
      }
    }
    announce(log + "\n" + getSkillPrompt());
  }
}

  mode = 'arena_select';

  menuCursor = 0;
  menuOptions = petInventory.map(function(p, i) {
    return { id: i, label: p.name + ' Lv.' + p.level + ' (' + p.element + ') ATK' + p.atk + ' HP' + p.hp };

function showArena() {
  const shop = getShopAt(r, c);
  if (shop && shop.id === 'arena') {
    startArenaFromCity();
  } else {
    announce("ลานประลองอยู่กลางเมืองหลวง\nเดินไปที่พิกัด 51, 51 แล้วกด Enter");
  }
}

function selectArenaPet(index) {
  if (index < 0 || index >= petInventory.length) return;
  const pet = petInventory[index];
  const win = playerData.arenaWins || 0;
  let pool = ARENA_OPPONENTS;
  if (win < 2) pool = ARENA_OPPONENTS.slice(0, 3);
  else if (win < 5) pool = ARENA_OPPONENTS.slice(0, 5);
  else if (win < 8) pool = ARENA_OPPONENTS.slice(1, 7);
  else pool = ARENA_OPPONENTS.slice(3);

  const opp = pool[Math.floor(Math.random() * pool.length)];
  const enemy = {
    name: opp.petName,
    level: opp.level,
    element: opp.element,
    atk: opp.atk,
    hp: opp.hp,
    maxHp: opp.hp,
    weakness: ELEMENT_WEAKNESS[opp.element] || 'น้ำ',
    trainer: opp.name
  };

  battleState = {
    myPet: { name: pet.name, level: pet.level, element: pet.element, atk: pet.atk, hp: pet.hp, maxHp: pet.maxHp || pet.hp, weakness: pet.weakness },
    enemy: enemy,
    isWild: false,
    canCatch: false
  };
  mode = 'battle';
  showBattleUI("พบคู่ต่อสู้: " + opp.name);
}

function feedPet(index) {
  if (index < 0 || index >= petInventory.length) return;
  const pet = petInventory[index];
  const foodMap = { 'ไฟ':'food_fire','น้ำ':'food_water','พืช':'food_grass','ไฟฟ้า':'food_electric','หิน':'food_rock' };
  const foodKey = foodMap[pet.element];
  if (!foodKey || (playerData.inventory[foodKey]||0) <= 0) {
    announce("ไม่มีอาหารธาตุ" + pet.element);
    return;
  }
  playerData.inventory[foodKey]--;
  pet.level += 1;
  pet.atk += 4 + Math.floor(Math.random()*3);
  const addHp = 6 + Math.floor(Math.random()*4);
  pet.maxHp = (pet.maxHp || pet.hp) + addHp;
  pet.hp = pet.maxHp;
  pet.sellPrice = Math.floor(pet.level * 42 + 80);
  saveGame();
  updateStatusBar();
  announce("ให้อาหาร " + pet.name + " สำเร็จ!\nLv." + pet.level + " | ATK " + pet.atk + " | HP " + pet.hp);
}

function evolvePet(index) {
  if (index < 0 || index >= petInventory.length) return;
  const pet = petInventory[index];
  if (pet.evolved) { announce(pet.name + " วิวัฒนาการไปแล้ว"); return; }
  if (!EVOLUTION_MAP[pet.name]) { announce(pet.name + " วิวัฒนาการไม่ได้"); return; }
  if (pet.level < 12) { announce("เลเวลยังไม่พอ (ต้องการ ≥ 12)"); return; }
  if ((playerData.inventory.evo_stone||0) <= 0) {
    announce("ไม่มีหินวิวัฒนาการ\nไปซื้อที่ร้านหินวิวัฒนาการในเมือง");
    return;
  }
  playerData.inventory.evo_stone--;
  const old = pet.name;
  pet.name = EVOLUTION_MAP[old];
  pet.evolved = true;
  pet.level += 2;
  pet.atk = Math.floor(pet.atk * 1.35) + 8;
  pet.maxHp = Math.floor((pet.maxHp||pet.hp) * 1.30) + 15;
  pet.hp = pet.maxHp;
  pet.sellPrice = Math.floor(pet.level * 55 + 150);
  saveGame();
  updateStatusBar();
  announce("วิวัฒนาการ!\n" + old + " → " + pet.name + "\nLv." + pet.level + " | ATK " + pet.atk + " | HP " + pet.hp);
}

function sellPet(index) {
  if (index < 0 || index >= petInventory.length) return;
  const pet = petInventory[index];
  playerData.money += pet.sellPrice;
  petInventory.splice(index, 1);
  saveGame();
  updateStatusBar();
  announce("ขาย " + pet.name + " ได้ " + pet.sellPrice + " G");
}

// ===== แชท =====
const CHAT_KEY = 'tri_monster_chat_v2';
let chatMessages = [];
let chatReadIndex = -1;
let chatReplyTo = null;

function loadChat() {
  try {
    chatMessages = JSON.parse(localStorage.getItem(CHAT_KEY) || '[]');
  } catch (e) { chatMessages = []; }
  if (!chatMessages.length) {
    chatMessages.push({ from: 'ระบบ', text: 'ยินดีต้อนรับสู่แชทโลกไตรภูมิ' });
    saveChat();
  }
}
function saveChat() {
  try {
    if (chatMessages.length > 80) chatMessages = chatMessages.slice(-80);
    localStorage.setItem(CHAT_KEY, JSON.stringify(chatMessages));
  } catch (e) {}
}
function renderChatLog() {
  const log = document.getElementById('chatLog');
  if (!log) return;
  let t = '';
  chatMessages.forEach(function(m, i) {
    t += (i === chatReadIndex ? '▶ ' : '') + '[' + m.from + ']' +
      (m.replyTo ? ' (ตอบ: ' + m.replyTo + ')' : '') + ' ' + m.text + '\n';
  });
  log.textContent = t || '(ยังไม่มีข้อความ)';
  log.scrollTop = log.scrollHeight;
}
function focusGame() {
  const inp = document.getElementById('chatInput');
  if (inp && document.activeElement === inp) return; // กำลังพิมพ์แชท — ไม่แย่งโฟกัส
  if (inp) inp.blur();
  const body = document.getElementById('gameBody');
  if (body) {
    // role="application" ทำให้ NVDA/JAWS เข้าโหมดโฟกัสอัตโนมัติ ไม่ต้องกด Insert+Space
    if (!body.getAttribute('role')) body.setAttribute('role', 'application');
    body.setAttribute('tabindex', '0');
    try {
      body.focus({ preventScroll: true });
    } catch (e) {
      body.focus();
    }
  }
}

function showChatPanel() {
  const panel = document.getElementById('chatPanel');
  if (panel) panel.style.display = 'block';
  renderChatLog();
}

function hideChatPanel() {
  const panel = document.getElementById('chatPanel');
  if (panel) panel.style.display = 'none';
  focusGame();
}
function chatReadPrev() {
  if (!chatMessages.length) return;
  showChatPanel();
  if (chatReadIndex < 0) chatReadIndex = chatMessages.length - 1;
  else chatReadIndex = Math.max(0, chatReadIndex - 1);
  renderChatLog();
  const m = chatMessages[chatReadIndex];
  announce('อ่าน (' + (chatReadIndex+1) + '/' + chatMessages.length + ')\n[' + m.from + '] ' + m.text);
}
function chatReadNext() {
  if (!chatMessages.length) return;
  showChatPanel();
  if (chatReadIndex < 0) chatReadIndex = 0;
  else chatReadIndex = Math.min(chatMessages.length - 1, chatReadIndex + 1);
  renderChatLog();
  const m = chatMessages[chatReadIndex];
  announce('อ่าน (' + (chatReadIndex+1) + '/' + chatMessages.length + ')\n[' + m.from + '] ' + m.text);
}
function startChatType() {
  const inp = document.getElementById('chatInput');
  if (!inp) return;
  showChatPanel();
  if (chatReadIndex >= 0 && chatMessages[chatReadIndex]) {
    const m = chatMessages[chatReadIndex];
    chatReplyTo = m.from + ': ' + m.text.slice(0, 28);
    inp.placeholder = 'ตอบ [' + m.from + '] ...';
    announce('ตอบ [' + m.from + '] — พิมพ์แล้วกด Enter\n(Esc ยกเลิก)');
  } else {
    chatReplyTo = null;
    inp.placeholder = 'พิมพ์ข้อความแล้วกด Enter...';
    announce('พิมพ์แชท — พิมพ์แล้วกด Enter เพื่อส่ง\n(Esc ยกเลิก)');
  }
  setTimeout(function() { inp.focus(); }, 50);
}
function sendChat() {
  const inp = document.getElementById('chatInput');
  if (!inp) return;
  const msg = (inp.value || '').trim();
  if (!msg) {
    hideChatPanel();
    return;
  }
  chatMessages.push({
    from: 'คุณ',
    text: msg,
    replyTo: chatReplyTo || null
  });
  saveChat();
  chatReadIndex = chatMessages.length - 1;
  chatReplyTo = null;
  inp.value = '';
  inp.placeholder = 'พิมพ์แชทแล้วกด Enter...';
  renderChatLog();
  announce('ส่งแล้ว: ' + msg);
  hideChatPanel();
  if (Math.random() < 0.4) {
    setTimeout(function() {
      const npcs = [
        ['นักเดินทาง', 'เดินทางปลอดภัยนะ'],
        ['พ่อค้า', 'แวะร้านในเมืองได้เสมอ'],
        ['นักรบ', 'ลานประลองรอท้าทายอยู่'],
        ['ระบบ', 'ข้อความถูกส่งสู่โลกไตรภูมิ']
      ];
      const n = npcs[Math.floor(Math.random()*npcs.length)];
      chatMessages.push({ from: n[0], text: n[1] });
      saveChat();
    }, 900);
  }
}
function cancelChat() {
  const inp = document.getElementById('chatInput');
  chatReplyTo = null;
  if (inp) {
    inp.value = '';
    inp.placeholder = 'พิมพ์แชทแล้วกด Enter...';
  }
  hideChatPanel();
  announce('ยกเลิกแชท');
}

// ============================================================
// Keyboard
// ============================================================
window.addEventListener('keydown', function(e) {
  const code = e.code;
  const key = e.key;
  const inp = document.getElementById('chatInput');
  const typing = (inp && document.activeElement === inp);

  if (typing) {
    if (code === 'Enter') {
      e.preventDefault();
      sendChat();
      return;
    }
    if (code === 'Escape') {
      e.preventDefault();
      cancelChat();
      return;
    }
    return;
  }

  if (key === '/') {
    e.preventDefault();
    startChatType();
    return;
  }
  if (key === '[') {
    e.preventDefault();
    chatReadPrev();
    return;
  }
  if (key === ']') {
    e.preventDefault();
    chatReadNext();
    return;
  }

  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","KeyW","KeyA","KeyS","KeyD"].includes(code)) {
    e.preventDefault();
  }
  startBGM();

  if (mode === 'explore') {
    if (code === 'ArrowUp' || code === 'KeyW') move(-1, 0);
    else if (code === 'ArrowDown' || code === 'KeyS') move(1, 0);
    else if (code === 'ArrowLeft' || code === 'KeyA') move(0, -1);
    else if (code === 'ArrowRight' || code === 'KeyD') move(0, 1);
    else if (code === 'Enter') tryInteract();
    else if (code === 'KeyB') checkCurrentPosition();
    else if (code === 'KeyC') startSearch();
    else if (code === 'KeyR') showArena();
    else if (code === 'KeyI') showInventory();
    else if (code === 'KeyM') {
      announce(
        "=== เมนูช่วยเหลือ ===\n\n" +
        "ลูกศร / WASD = เดิน (หน้าสำรวจ)\n" +
        "ลูกศรขึ้น/ลง = เลือกเมนู (ร้าน/คลัง/ต่อสู้)\n" +
        "Enter = เปิดร้าน / ยืนยันเมนู\n" +
        "[ ] = อ่านแชท | / = พิมพ์แชท\n" +
        "C = ค้นหาสัตว์ป่าเอง (นอกเมือง)\n" +
        "เดินนอกเมือง = มีโอกาสเจอมอนโผล่เอง\n" +
        "I = คลังสัตว์เลี้ยง\n" +
        "B = เช็คพิกัด\n\n" +
        "ในเมือง (เดินไปยืนแล้วกด Enter):\n" +
        "• แถว 49 หลัก 51 = ร้านลูกบอล\n" +
        "• แถว 51 หลัก 49 = ร้านอาหาร\n" +
        "• แถว 53 หลัก 51 = ร้านหินวิวัฒนาการ\n" +
        "• แถว 51 หลัก 51 = ลานประลอง\n" +
        "• แถว 51 หลัก 53 = ศูนย์ข้อมูล\n\n" +
        "มือถือ: แตะค้างจอยสติ๊กเพื่อเดิน\n" +
        "ปุ่ม Enter / C / I / B / M / Esc ด้านล่าง"
      );
    }
  }
  else if (mode === 'shop' || mode === 'catch_select' || mode === 'arena_select' || mode === 'battle' || mode === 'inventory' || mode === 'inventory_action') {
    if (code === 'ArrowUp' || code === 'KeyW') {
      menuMove(-1);
      e.preventDefault();
    } else if (code === 'ArrowDown' || code === 'KeyS') {
      menuMove(1);
      e.preventDefault();
    } else if (code === 'Enter') {
      e.preventDefault();
      handleConfirm();
    } else if (code === 'Escape' || code === 'KeyB') {
      handleEsc();
    }
  }
});

function handleConfirm() {
  if (mode === 'shop') {
    if (menuOptions[menuCursor]) buy(menuOptions[menuCursor].id);
    const inv = playerData.inventory;
    menuOptions.forEach(function(opt) {
      if (opt.id === 'pokeball') opt.label = 'Pokeball ธรรมดา  100G  (มี ' + (inv.pokeball||0) + ')';
      if (opt.id === 'greatball') opt.label = 'Great Ball       300G  (มี ' + (inv.greatball||0) + ')';
      if (opt.id === 'ultraball') opt.label = 'Ultra Ball       800G  (มี ' + (inv.ultraball||0) + ')';
      if (opt.id === 'food_fire') opt.label = 'อาหารธาตุไฟ      80G  (มี ' + (inv.food_fire||0) + ')';
      if (opt.id === 'food_water') opt.label = 'อาหารธาตุน้ำ     80G  (มี ' + (inv.food_water||0) + ')';
      if (opt.id === 'food_grass') opt.label = 'อาหารธาตุพืช     80G  (มี ' + (inv.food_grass||0) + ')';
      if (opt.id === 'food_electric') opt.label = 'อาหารธาตุไฟฟ้า 100G  (มี ' + (inv.food_electric||0) + ')';
      if (opt.id === 'food_rock') opt.label = 'อาหารธาตุหิน     80G  (มี ' + (inv.food_rock||0) + ')';
      if (opt.id === 'evo_stone') opt.label = 'หินวิวัฒนาการ  500G  (มี ' + (inv.evo_stone||0) + ')';
    });
    renderMenu(menuTitle || 'ร้านค้า', 'ลูกศรขึ้น/ลง เลือก | Enter ซื้อ | Esc กลับ');
  } else if (mode === 'catch_select') {
    if (menuOptions[menuCursor]) selectBattlePet(menuOptions[menuCursor].id);
  } else if (mode === 'arena_select') {
    if (menuOptions[menuCursor]) selectArenaPet(menuOptions[menuCursor].id);
  } else if (mode === 'battle') {
    if (menuOptions[menuCursor]) doSkill(menuOptions[menuCursor].id);
    if (mode === 'battle') {
      buildBattleOptions();
      renderBattleMenu();
    }
  } else if (mode === 'inventory') {
    openInvActionMenu();
  } else if (mode === 'inventory_action') {
    const act = menuOptions[menuCursor] && menuOptions[menuCursor].id;
    if (act === 'feed') { feedPet(selectedPetIndex); showInventory(); }
    else if (act === 'evolve') { evolvePet(selectedPetIndex); showInventory(); }
    else if (act === 'sell') { sellPet(selectedPetIndex); showInventory(); }
    else { showInventory(); }
  } else if (mode === 'explore') {
    tryInteract();
  }
}

function handleEsc() {
  if (mode === 'inventory_action') {
    showInventory();
  } else if (mode === 'catch_select') {
    mode = 'explore'; battleState = null;
    announce('คุณหนีจากสัตว์ป่า');
  } else if (mode === 'battle') {
    doSkill('flee');
  } else if (mode !== 'explore') {
    mode = 'explore';
    menuOptions = [];
    announce('กลับสู่โหมดสำรวจ');
  }
}

// ============================================================
// Mobile accessible controls (TalkBack / VoiceOver เหมือน NVDA)
// ============================================================
let dirHold = null; // { dr, dc }
let dirInterval = null;

function isTouchDevice() {
  return ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
}

function showMobileControls() {
  const el = document.getElementById('mobileControls');
  if (!el) return;
  // แสดงบนมือถือเสมอ และบนจอแคบ — เพื่อให้ TalkBack ใช้ปุ่มได้
  if (isTouchDevice() || window.innerWidth < 900) {
    el.style.display = 'block';
    el.classList.add('visible');
    const help = document.getElementById('helpText');
    if (help) {
      help.textContent = 'ปุ่มขึ้นลงซ้ายขวา = เดิน (กดค้างได้) · ยืนยัน/กลับ/ค้นหามอน/คลัง';
    }
  }
}

let gameStarted = false;

function startGame() {
  if (gameStarted) {
    focusGame();
    return;
  }
  gameStarted = true;
  const screen = document.getElementById('startScreen');
  if (screen) screen.classList.add('hidden');
  showMobileControls();
  startBGM();
  const body = document.getElementById('gameBody');
  if (body) {
    body.setAttribute('tabindex', '0');
    body.focus({ preventScroll: true });
  }
  announce("เกมเริ่มแล้ว!");
  focusGame();
  setTimeout(focusGame, 50);
  setTimeout(focusGame, 150);
  setTimeout(focusGame, 400);
}

// ดึงโฟกัสกลับเกมทุกครั้งที่มี interaction (ยกเว้นพิมพ์แชท)
function lockFocusOnInteraction(e) {
  const t = e.target;
  if (t && (t.id === 'chatInput' || t.id === 'chatCloseBtn' || t.id === 'startBtn')) return;
  if (t && t.closest && t.closest('#chatPanel') && t.tagName === 'INPUT') return;
  if (!gameStarted) {
    startGame();
    return;
  }
  focusGame();
}

function dirFromName(name) {
  if (name === 'up') return { dr: -1, dc: 0 };
  if (name === 'down') return { dr: 1, dc: 0 };
  if (name === 'left') return { dr: 0, dc: -1 };
  if (name === 'right') return { dr: 0, dc: 1 };
  return { dr: 0, dc: 0 };
}

function applyDirection(dr, dc) {
  if (mode === 'explore') {
    move(dr, dc);
  } else if (mode === 'shop' || mode === 'catch_select' || mode === 'arena_select' || mode === 'battle' || mode === 'inventory' || mode === 'inventory_action') {
    if (dr === -1) menuMove(-1);
    else if (dr === 1) menuMove(1);
  }
}

function startDirHold(dr, dc) {
  dirHold = { dr: dr, dc: dc };
  applyDirection(dr, dc); // กดครั้งแรกทำทันที
  if (dirInterval) clearInterval(dirInterval);
  dirInterval = setInterval(function() {
    if (!dirHold) return;
    applyDirection(dirHold.dr, dirHold.dc);
  }, MOVE_COOLDOWN);
}

function stopDirHold() {
  dirHold = null;
  if (dirInterval) {
    clearInterval(dirInterval);
    dirInterval = null;
  }
}

// ปุ่มทิศทาง 4 ทิศ — กดครั้งเดียวหรือกดค้าง (รองรับ TalkBack)
function setupJoystick() {
  document.querySelectorAll('.mc-dir[data-dir]').forEach(function(btn) {
    const dir = dirFromName(btn.getAttribute('data-dir'));

    function onDown(e) {
      // ไม่ preventDefault ทุกกรณี — ให้ TalkBack เปิดใช้งานปุ่มได้
      if (e.type === 'touchstart') e.preventDefault();
      startBGM();
      btn.classList.add('pressed');
      startDirHold(dir.dr, dir.dc);
    }
    function onUp(e) {
      btn.classList.remove('pressed');
      stopDirHold();
    }
    function onClick(e) {
      // TalkBack มักส่ง click แทน touch — เดินทีละก้าว
      e.preventDefault();
      startBGM();
      applyDirection(dir.dr, dir.dc);
    }

    btn.addEventListener('touchstart', onDown, { passive: false });
    btn.addEventListener('touchend', onUp);
    btn.addEventListener('touchcancel', onUp);
    btn.addEventListener('mousedown', onDown);
    btn.addEventListener('mouseup', onUp);
    btn.addEventListener('mouseleave', onUp);
    btn.addEventListener('click', onClick);
  });
}

function setupActionButtons() {
  document.querySelectorAll('.mc-btn[data-action]').forEach(function(btn) {
    const action = btn.getAttribute('data-action');
    function fire(e) {
      e.preventDefault();
      e.stopPropagation();
      startBGM();
      btn.classList.add('pressed');
      setTimeout(function() { btn.classList.remove('pressed'); }, 120);

      if (action === 'enter') {
        if (mode === 'explore') tryInteract();
        else handleConfirm();
      } else if (action === 'esc') {
        handleEsc();
      } else if (action === 'c') {
        if (mode === 'explore') startSearch();
      } else if (action === 'i') {
        if (mode === 'explore') showInventory();
        else if (mode === 'inventory' || mode === 'inventory_action') handleEsc();
      } else if (action === 'b') {
        if (mode === 'explore') checkCurrentPosition();
      } else if (action === 'm') {
        if (mode === 'explore') {
          announce(
            "=== เมนูช่วยเหลือ ===\n\n" +
            "มือถือ + โปรแกรมอ่านจอ:\n" +
            "ปุ่ม ขึ้น ลง ซ้าย ขวา = เดิน (กดค้างได้)\n" +
            "ในเมนู: ขึ้น/ลง = เลือกรายการ\n\n" +
            "ยืนยัน = เปิดร้าน / เลือกเมนู\n" +
            "กลับ = ยกเลิก / หนี\n" +
            "ค้นหามอน = หาสัตว์ป่า (นอกเมือง)\n" +
            "คลัง = ดูสัตว์เลี้ยง\n" +
            "พิกัด = ดูตำแหน่งปัจจุบัน\n\n" +
            "ในเมือง (เดินไปยืนแล้วกดยืนยัน):\n" +
            "แถว 49 หลัก 51 = ร้านลูกบอล\n" +
            "แถว 51 หลัก 49 = ร้านอาหาร\n" +
            "แถว 53 หลัก 51 = ร้านหิน\n" +
            "แถว 51 หลัก 51 = ลานประลอง\n" +
            "แถว 51 หลัก 53 = ศูนย์ข้อมูล"
          );
        }
      }
      // หลังใช้คำสั่ง ให้โฟกัสกลับพื้นที่เกม (role=application)
      setTimeout(focusGame, 30);
    }
    btn.addEventListener('click', fire);
    btn.addEventListener('touchend', function(e) {
      // กัน double-fire กับ click บนบางเครื่อง
      if (e.cancelable) e.preventDefault();
      fire(e);
    }, { passive: false });
  });
}

// แตะที่พื้นที่เกมเพื่อโฟกัส — เก็บโฟกัสไว้ตลอด
function setupFocusOnTap() {
  const body = document.getElementById('gameBody');
  if (!body) return;
  body.addEventListener('click', function(e) {
    if (e.target && (e.target.id === 'chatInput' || e.target.id === 'chatCloseBtn')) return;
    if (e.target && e.target.closest && e.target.closest('#chatPanel') && e.target.tagName === 'INPUT') return;
    focusGame();
    startBGM();
  });
  // ถ้าโฟกัสหลุด (ยกเว้นตอนพิมพ์แชท) ให้ดึงกลับ
  body.addEventListener('blur', function() {
    setTimeout(function() {
      const ae = document.activeElement;
      if (ae && (ae.id === 'chatInput' || ae.id === 'chatCloseBtn')) return;
      if (ae && ae.classList && ae.classList.contains('mc-btn')) return;
      focusGame();
    }, 0);
  });
  const closeBtn = document.getElementById('chatCloseBtn');
  if (closeBtn) {
    closeBtn.addEventListener('click', function(e) {
      e.preventDefault();
      hideChatPanel();
    });
  }
  focusGame();
  setTimeout(focusGame, 50);
  setTimeout(focusGame, 200);
  setTimeout(focusGame, 500);
}

window.onload = function() {
  loadGame();
  loadChat();
  if (chatMessages.length) chatReadIndex = chatMessages.length - 1;
  setupJoystick();
  setupActionButtons();
  setupFocusOnTap();

  // ปุ่มเริ่มเกม (ถ้ายังแสดงอยู่)
  const startBtn = document.getElementById('startBtn');
  if (startBtn) {
    startBtn.addEventListener('click', function(e) {
      e.preventDefault();
      startGame();
    });
    startBtn.addEventListener('touchend', function(e) {
      e.preventDefault();
      startGame();
    }, { passive: false });
  }

  // interaction ใดๆ = เริ่มเกม + ล็อกโฟกัส
  document.addEventListener('pointerdown', lockFocusOnInteraction, true);
  document.addEventListener('keydown', function(e) {
    if (!gameStarted) {
      startGame();
    } else {
      const inp = document.getElementById('chatInput');
      if (inp && document.activeElement === inp) return;
      // คงโฟกัสที่เกมไว้ตลอดตอนเล่น
      const body = document.getElementById('gameBody');
      if (body && document.activeElement !== body && document.activeElement !== inp) {
        body.focus({ preventScroll: true });
      }
    }
  }, true);

  // ===== เข้าโหมดโฟกัสอัตโนมัติตอนเปิดเกม =====
  // เรียก startGame ทันที (ไม่ต้องรอคลิก)
  startGame();

  // โฟกัสซ้ำหลายรอบ — บางเบราว์เซอร์รับหลัง paint
  requestAnimationFrame(function() {
    focusGame();
    setTimeout(focusGame, 0);
    setTimeout(focusGame, 100);
    setTimeout(focusGame, 300);
    setTimeout(focusGame, 600);
  });

  // ถ้ากลับมาแท็บนี้ ให้โฟกัสใหม่
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden && gameStarted) focusGame();
  });
  window.addEventListener('focus', function() {
    if (gameStarted) focusGame();
  });
};
</script>
