<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ไตรภูมิ Monster Quest</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- หน้าจอเริ่มเกม (ซ่อนอัตโนมัติหลังโหลด — role=application จะเข้าโหมดโฟกัสเอง) -->
  <div id="startScreen" class="hidden" aria-hidden="true">
    <h1>ไตรภูมิ Monster Quest</h1>
    <p>กำลังเข้าสู่เกม...</p>
    <button type="button" id="startBtn">เริ่มเกม</button>
  </div>

  <div id="gameBody" tabindex="0" role="application" aria-label="ไตรภูมิ Monster Quest เกมสำรวจและจับมอนสเตอร์ กดลูกศรเพื่อเดิน Enter เพื่อยืนยัน">
    <div class="status" aria-live="polite">
      <span>บอล: <span id="ball-count">0</span> | อาหาร: <span id="food-count">0</span> | หิน: <span id="evo-count">0</span></span>
      <span class="money">เหรียญ: <span id="money">1,000</span> G</span>
    </div>
    <div id="display" role="status" aria-live="assertive" aria-atomic="true">กำลังเริ่มเกม...</div>
    <div id="chatPanel" style="display:none;">
      <div style="font-weight:700; margin-bottom:8px; color:#93c5fd; display:flex; justify-content:space-between; align-items:center;">
        <span>แชทโลกไตรภูมิ</span>
        <button type="button" id="chatCloseBtn" style="background:#334155; border:none; color:#e2e8f0; border-radius:6px; padding:4px 10px; font-size:0.8rem; cursor:pointer;">ปิด</button>
      </div>
      <div id="chatLog" style="height:100px; overflow-y:auto; background:#020617; border-radius:6px; padding:8px; font-size:0.88rem; line-height:1.5; margin-bottom:8px; white-space:pre-wrap;"></div>
      <input id="chatInput" type="text" placeholder="พิมพ์แชทแล้วกด Enter..." maxlength="120"
        style="width:100%; padding:8px 10px; border-radius:6px; border:1px solid #475569; background:#1e293b; color:#e2e8f0; outline:none; box-sizing:border-box; font-size:16px;" />
    </div>
    <div class="help" id="helpText">
      ลูกศร / WASD = เดิน · Enter = ยืนยัน · C = ค้นหามอน · I = คลัง · M = ช่วยเหลือ · / = แชท
    </div>
  </div>

  <!-- Mobile controls — ปุ่มทิศทาง + คำสั่ง อ่านด้วย TalkBack/VoiceOver ได้เหมือน NVDA -->
  <div id="mobileControls" style="display:none;" role="group" aria-label="แผงควบคุมเกมมือถือ">
    <div class="mc-row">
      <div class="dpad-grid" role="group" aria-label="ปุ่มเดิน">
        <button type="button" class="mc-btn mc-dir dir-up" data-dir="up" aria-label="เดินขึ้น กดค้างเพื่อเดินต่อ">▲ ขึ้น</button>
        <button type="button" class="mc-btn mc-dir dir-left" data-dir="left" aria-label="เดินซ้าย กดค้างเพื่อเดินต่อ">◀ ซ้าย</button>
        <div class="mc-btn dir-center" aria-hidden="true">เดิน</div>
        <button type="button" class="mc-btn mc-dir dir-right" data-dir="right" aria-label="เดินขวา กดค้างเพื่อเดินต่อ">ขวา ▶</button>
        <button type="button" class="mc-btn mc-dir dir-down" data-dir="down" aria-label="เดินลง กดค้างเพื่อเดินต่อ">▼ ลง</button>
      </div>
      <div class="action-btns" role="group" aria-label="ปุ่มคำสั่ง">
        <button type="button" class="mc-btn primary" data-action="enter" aria-label="ยืนยัน หรือเปิดร้าน">ยืนยัน</button>
        <button type="button" class="mc-btn" data-action="esc" aria-label="กลับ หรือหนี">กลับ</button>
        <button type="button" class="mc-btn" data-action="c" aria-label="ค้นหาสัตว์ป่า">ค้นหามอน</button>
        <button type="button" class="mc-btn" data-action="i" aria-label="เปิดคลังสัตว์เลี้ยง">คลัง</button>
        <button type="button" class="mc-btn" data-action="b" aria-label="เช็คพิกัดปัจจุบัน">พิกัด</button>
        <button type="button" class="mc-btn" data-action="m" aria-label="เมนูช่วยเหลือ">ช่วยเหลือ</button>
      </div>
    </div>
    <div class="mc-hint" id="mobileHint">กดค้างปุ่มทิศทางเพื่อเดิน · ปุ่มคำสั่งด้านล่าง · ข้อความเกมอ่านอัตโนมัติ</div>
  </div>

  <div id="srAnnouncer" class="sr-only" aria-live="assertive"></div>

  <script src="01_map_audio.js"></script>
  <script src="02_data_save.js"></script>
  <script src="03_explore.js"></script>
  <script src="04_shop.js"></script>
  <script src="05_catch.js"></script>
  <script src="06_battle.js"></script>
  <script src="07_arena.js"></script>
  <script src="08_inventory.js"></script>
  <script src="09_chat.js"></script>
  <script src="10_keyboard.js"></script>
  <script src="11_mobile.js"></script>
  <script src="12_main.js"></script>
</body>
</html>
